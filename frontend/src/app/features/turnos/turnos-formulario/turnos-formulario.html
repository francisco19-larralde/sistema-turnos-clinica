<div class="p-6">
  <div class="card bg-base-100 shadow-md max-w-3xl p-6">
    <h1 class="text-xl font-bold mb-6">Reservar turno</h1>

    <div class="flex flex-col gap-1 mb-6 max-w-sm">
      <label class="text-sm font-medium">Profesional</label>
      <p-select [options]="profesionales()" optionLabel="matricula" placeholder="Seleccioná un profesional"
        (onChange)="seleccionarProfesional($event.value)">
        <ng-template let-profesional #item>
          {{ profesional.usuario.nombre }} {{ profesional.usuario.apellido }} — {{ profesional.especialidad.nombre }}
        </ng-template>
      </p-select>
    </div>

    @if (profesionalSeleccionadoId()) {
    <app-matriz-turnos [profesionalId]="profesionalSeleccionadoId()!"
      (horarioSeleccionado)="onHorarioSeleccionado($event)" />
    }

    @if (seleccion()) {
    <div class="mt-6 flex items-center justify-between bg-base-200 rounded-box p-4">
      <span>
        Turno seleccionado: <strong>{{ seleccion()!.fecha }} a las {{ seleccion()!.hora }}</strong>
      </span>
      <p-button label="Confirmar turno" [loading]="cargando()" (onClick)="confirmarTurno()" />
    </div>
    }

    @if (error()) {
    <div class="text-error text-sm mt-4">{{ error() }}</div>
    }

    <a routerLink="/turnos" class="text-sm text-base-content/60 mt-6 inline-block">← Volver</a>
  </div>
</div>
