<p-toast />
<p-confirmdialog />

<div class="p-6">
  <h1 class="text-xl font-bold mb-4">Pacientes</h1>

  @if (error()) {
    <div class="mb-4 text-error" role="alert">{{ error() }} <p-button label="Reintentar" severity="secondary" (onClick)="pagina.cargar()" /></div>
  }

  <p-table #tabla [value]="pacientes()" styleClass="rounded-box overflow-hidden" [paginator]="true" [rows]="pagina.filas()" [first]="pagina.primero()"
    [lazy]="true" (onLazyLoad)="pagina.cargar($event)" [totalRecords]="pagina.total()" [loading]="cargando()"
    [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} de {totalRecords}" [pageLinks]="3"
    [globalFilterFields]="['usuario.nombre', 'usuario.apellido', 'dni', 'usuario.email', 'telefono']">
    <ng-template #caption>
      <app-filtros-tabla [tabla]="tabla" placeholder="Nombre, apellido, DNI o email"  />
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="5" class="py-8 text-center">No hay resultados para los filtros seleccionados.</td></tr>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>DNI</th>
        <th>Email</th>
        <th>Teléfono</th>
        <th class="w-32"></th>
      </tr>
    </ng-template>
    <ng-template #body let-paciente>
      <tr>
        <td>{{ paciente.usuario.nombre }} {{ paciente.usuario.apellido }}</td>
        <td>{{ paciente.dni }}</td>
        <td>{{ paciente.usuario.email }}</td>
        <td>{{ paciente.telefono ?? '—' }}</td>
        <td class="flex gap-2">
          <a [routerLink]="[paciente.id, 'editar']">
            <p-button icon="pi pi-pencil" severity="secondary" [text]="true" />
          </a>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="confirmarEliminacion(paciente)" />
        </td>
      </tr>
    </ng-template>
  </p-table>

</div>
