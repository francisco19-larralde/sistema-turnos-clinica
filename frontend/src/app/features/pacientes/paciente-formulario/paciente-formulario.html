<div class="p-6">
  <div class="card bg-base-100 shadow-md max-w-md p-6">
    <h1 class="text-xl font-bold mb-6">Editar paciente</h1>

    <form [formGroup]="formulario" (ngSubmit)="enviar()" class="flex flex-col gap-4">
      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium">DNI</label>
        <input pInputText formControlName="dni" class="w-full" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium">Fecha de nacimiento</label>
        <p-datepicker formControlName="fechaNacimiento" dateFormat="dd/mm/yy" [showIcon]="true" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-sm font-medium">Teléfono</label>
        <input pInputText formControlName="telefono" class="w-full" />
      </div>

      @if (error()) {
      <div class="text-error text-sm">{{ error() }}</div>
      }

      <div class="flex gap-2 mt-2">
        <p-button type="submit" label="Guardar" [loading]="cargando()" />
        <p-button type="button" label="Cancelar" severity="secondary" [outlined]="true" routerLink="/pacientes" />
      </div>
    </form>
  </div>
</div>
