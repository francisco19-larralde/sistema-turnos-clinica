<div class="min-h-screen bg-[#f8faf7] px-5 py-10 text-[#183c36] sm:py-16">
  <div class="mx-auto max-w-5xl">

    <div
      class="mb-10 flex items-start justify-between gap-6 rounded-3xl border border-teal-900/10 bg-white p-8 shadow-sm sm:p-10">
      <div>
        <p class="text-xs font-semibold tracking-[0.16em] text-teal-700">TU ESPACIO</p>
        <h1 class="mt-3 text-3xl font-semibold tracking-tight sm:text-4xl">
          Hola, {{ authService.usuarioActual()?.nombre }}
        </h1>
        <p class="mt-2 text-sm text-slate-500">
          Rol: {{ authService.usuarioActual()?.rol }}
        </p>
      </div>

      <p-button label="Cerrar sesión" icon="pi pi-sign-out" severity="secondary" [outlined]="true"
        styleClass="!rounded-xl" (onClick)="cerrarSesion()" />
    </div>

    @if (accesos().length > 0) {
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
      @for (acceso of accesos(); track acceso.ruta) {

      <a [routerLink]="acceso.ruta" class="group flex items-start gap-4 rounded-2xl border border-teal-900/10 bg-white p-6 shadow-sm transition-shadow
      hover:shadow-md">
        <span class="grid size-11 shrink-0 place-items-center rounded-full bg-teal-50 text-teal-700">
          <i [class]="acceso.icono" aria-hidden="true"></i>
        </span>
        <div>
          <h2 class="font-semibold text-[#183c36] group-hover:text-teal-800">{{ acceso.titulo }}</h2>
          <p class="mt-1 text-sm text-slate-500">{{ acceso.descripcion }}</p>
        </div>
      </a>
      }
    </div>
    }
  </div>
</div>
