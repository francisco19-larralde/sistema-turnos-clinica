<p-toast />
<p-confirmdialog />

<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-bold">Especialidades</h1>
    <a routerLink="nueva">
      <p-button label="Nueva especialidad" icon="pi pi-plus" />
    </a>
  </div>

  @if (cargando()) {
  <div class="text-center py-10 text-base-content/60">Cargando especialidades...</div>
  } @else if (error()) {
  <div class="text-center py-10 text-error">{{ error() }}</div>
  } @else if (especialidades().length === 0) {
  <div class="text-center py-10 text-base-content/60">
    Todavía no hay especialidades cargadas.
  </div>
  } @else {
  <p-table [value]="especialidades()" styleClass="rounded-box overflow-hidden">
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th class="w-32">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-especialidad>
      <tr>
        <td>{{ especialidad.nombre }}</td>
        <td>{{ especialidad.descripcion ?? '—' }}</td>
        <td class="flex gap-2">
          <a [routerLink]="[especialidad.id, 'editar']">
            <p-button icon="pi pi-pencil" severity="secondary" [text]="true" />
          </a>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="confirmarEliminacion(especialidad)" />
        </td>
      </tr>
    </ng-template>
  </p-table>
  }
</div>
