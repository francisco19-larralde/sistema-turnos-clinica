<p-toast />
<p-confirmdialog />

<div class="p-6">
  <div class="flex justify-between items-center mb-4">
    <h1 class="text-xl font-bold">Especialidades</h1>
    <a routerLink="nueva">
      <p-button label="Nueva especialidad" icon="pi pi-plus" />
    </a>
  </div>

  @if (error()) {
    <div class="mb-4 text-error" role="alert">{{ error() }} <p-button label="Reintentar" severity="secondary" (onClick)="pagina.cargar()" /></div>
  }

  <p-table #tabla [value]="especialidades()" styleClass="rounded-box overflow-hidden" [paginator]="true" [rows]="pagina.filas()" [first]="pagina.primero()"
    [lazy]="true" (onLazyLoad)="pagina.cargar($event)" [totalRecords]="pagina.total()" [loading]="cargando()"
    [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} de {totalRecords}" [pageLinks]="3"
    [globalFilterFields]="['nombre', 'descripcion']">
    <ng-template #caption>
      <app-filtros-tabla [tabla]="tabla" placeholder="Nombre o descripción"  />
    </ng-template>
    <ng-template #emptymessage>
      <tr><td colspan="3" class="py-8 text-center">No hay resultados para los filtros seleccionados.</td></tr>
    </ng-template>
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th class="w-32">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-especialidad>
      <tr>
        <td>{{ especialidad.nombre }}</td>
        <td>{{ especialidad.descripcion ?? '—' }}</td>
        <td class="flex gap-2">
          <a [routerLink]="[especialidad.id, 'editar']">
            <p-button icon="pi pi-pencil" severity="secondary" [text]="true" />
          </a>
          <p-button icon="pi pi-trash" severity="danger" [text]="true" (onClick)="confirmarEliminacion(especialidad)" />
        </td>
      </tr>
    </ng-template>
  </p-table>

</div>
