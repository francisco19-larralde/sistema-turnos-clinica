@if (authService.estaAutenticado()) {
<a class="skip-link" href="#contenido-principal">Ir al contenido</a>
<header class="app-header">
  <div class="header-top">
    <a routerLink="/inicio" class="brand" aria-label="Clínica — Inicio">
      <i class="pi pi-calendar-plus" aria-hidden="true"></i>
      <span>Clínica <span class="brand-detail">| Gestión de turnos</span></span>
    </a>

    <div class="session">
      <span class="user-name">{{ authService.usuarioActual()?.nombre }}</span>
      <button type="button" class="logout" (click)="authService.logout()">
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        Cerrar sesión
      </button>
    </div>
  </div>

  <nav class="navigation" aria-label="Navegación principal">
    <a routerLink="/inicio" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="pi pi-home" aria-hidden="true"></i> Inicio
    </a>
    <a routerLink="/turnos" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="pi pi-calendar" aria-hidden="true"></i> Turnos
    </a>
    @if (authService.usuarioActual()?.rol === 'ADMINISTRATIVO') {
    <a routerLink="/agenda" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="pi pi-calendar-clock" aria-hidden="true"></i> Agenda diaria
    </a>
    <a routerLink="/profesionales" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="pi pi-users" aria-hidden="true"></i> Profesionales
    </a>
    <a routerLink="/pacientes" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="pi pi-user" aria-hidden="true"></i> Pacientes
    </a>
    <a routerLink="/especialidades" routerLinkActive="active" ariaCurrentWhenActive="page">
      <i class="pi pi-list" aria-hidden="true"></i> Especialidades
    </a>
    }
  </nav>
</header>
}
